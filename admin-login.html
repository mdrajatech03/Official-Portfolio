<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
  <main class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Admin Login</h1>
    <p class="muted">Sign in to manage your portfolio.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <p id="msg" class="form-msg" role="alert"></p>
      <button id="login-btn" class="btn btn-primary btn-block" type="submit">Log in</button>
      <button id="forgot-btn" class="btn-link" type="button">Forgot password?</button>
    </form>
    <p class="small"><a href="index.html">← Back to portfolio</a></p>
  </main>
  <script type="module">
    import { initLoginPage } from "./js/admin-auth.js";
    initLoginPage();
  </script>
</body>
</html>
